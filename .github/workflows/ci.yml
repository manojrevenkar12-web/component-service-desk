name: ci
on:
  push:
  pull_request:

jobs:
  desk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Tests (rules, reading, reply check, golden cases, service on PGlite, MCP, invariants)
        run: npm test
      - name: The exports, golden cases, reports, gate, demo seed and README agree with the code
        run: |
          npm run export
          npm run golden
          npm run evaluate
          npm run bakeoff
          npm run gate
          npm run seed
          npm run readme
          git diff --exit-code knowledge evals reports demo README.md

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: desk
          POSTGRES_PASSWORD: desk
          POSTGRES_DB: desk
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U desk" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://desk:desk@localhost:5432/desk
      OPENAI_BASE_URL: http://localhost:8792/v1
      OPENAI_API_KEY: sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23
          cache: npm
      - run: npm ci
      - name: On PostgreSQL 16 with pgvector, a live mailbox is answered once per message and once per serial in SAP
        run: |
          node --import tsx src/desk/service/main.ts > desk.log 2>&1 &
          DESK=$!
          for i in $(seq 1 90); do curl -sf localhost:8790/healthz && break; sleep 1; done
          WORLD_TICKETS=60 npm run world -- --post http://localhost:8790
          Q() { PGPASSWORD=desk psql -h localhost -U desk -d desk -tAc "$1"; }
          test "$(Q 'select count(*) from messages')" = "$(Q 'select count(*) from outcomes')"
          test "$(Q 'select count(*) from messages')" -ge 60
          test "$(Q 'select count(*) from (select serial from sap_orders group by serial having count(*) > 1) d')" = "0"
          test "$(Q 'select count(*) from ledger where ok')" -gt 60
          curl -sf -H 'x-api-key: viewer-demo-key' 'localhost:8790/api/kb/search?q=pump%20gurgling%20rattling%20air' | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const r=JSON.parse(s);console.log(r.pgvector[0]);if(r.pgvector[0].id!=='aio-pump-noise')process.exit(1)})"
          kill $DESK
          sleep 2
          node --import tsx src/desk/service/main.ts > desk2.log 2>&1 &
          for i in $(seq 1 90); do curl -sf localhost:8790/healthz && break; sleep 1; done
          test "$(Q 'select count(*) from messages')" = "$(Q 'select count(*) from outcomes')"
          grep -q 'desk on :8790' desk2.log

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t component-service-desk .
      - name: The image serves the console and the demo day
        run: |
          docker run -d -p 8790:8790 --name desk component-service-desk
          for i in $(seq 1 90); do curl -sf localhost:8790/healthz && break; sleep 1; done
          curl -sf localhost:8790/ | grep -q '<div id="root">'
          curl -sf -H 'x-api-key: viewer-demo-key' localhost:8790/api/tickets | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{if(JSON.parse(s).length<50)process.exit(1)})"
